<title>駅・バス時刻</title>
<style>
:root{
  --bg:#F8F9FA;
  --surface:#FFFFFF;
  --text:#1A1A1A;
  --text-2:#4A4F55;
  --text-3:#6B7075;
  --line:#E3E6EA;
  --line-2:#EEF0F2;
  --field:#D5D9DE;
  --accent:#4A90E2;          /* 装飾（線・フォーカス・矢印） */
  --accent-strong:#2F6FB8;   /* 文字・ボタン（白地で読みやすい濃さ） */
  --accent-weak:#EEF4FC;
  --danger:#B3261E;
  --warn-bg:#FFF8E6;
  --warn-line:#F1E2B8;
  --go:#2F6FB8;              /* 行き（出勤） */
  --go-bg:#EEF4FC;
  --back:#A8560F;            /* 帰り（帰宅） */
  --back-bg:#FDF1E6;
  --radius:12px;
  --font:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-strong)}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid rgba(74,144,226,.45);outline-offset:2px}

/* ---------- 上部：現在時刻 ---------- */
.top{
  position:sticky;top:0;z-index:30;background:#FFFFFF;
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);
}
.top-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.app-name{font-size:13px;color:var(--text-3);letter-spacing:.04em}
.clock{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:.01em}
.clock .sec{font-size:19px;color:var(--text-3);margin-left:2px;font-weight:500}
.date{font-size:14px;color:var(--text-2)}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:inline-grid;place-items:center;color:var(--text-2);padding:0;
}
.icon-btn:hover{background:var(--bg)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.small{width:40px;height:40px}
.icon-btn.small svg{width:19px;height:19px}
.icon-btn.is-busy svg{animation:spin 1s linear infinite}

main{max-width:1200px;margin:0 auto;padding:16px calc(env(safe-area-inset-right) + 16px) 8px calc(env(safe-area-inset-left) + 16px)}

.banner{
  border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;
  padding:10px 14px;margin-bottom:14px;font-size:15px;color:var(--text);
}

/* ---------- パネル（区間追加・お気に入り） ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
.panel > summary{
  list-style:none;cursor:pointer;padding:12px 16px;min-height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;
}
.panel > summary::-webkit-details-marker{display:none}
.panel > summary .count{font-weight:500;color:var(--text-3);font-size:15px;margin-left:6px}
.chev{width:18px;height:18px;color:var(--text-3);transition:transform .2s}
.panel[open] > summary .chev{transform:rotate(180deg)}
.panel-body{padding:14px 16px 16px}
/* 上のタブ */
.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text-2);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
@media (min-width:760px){.tab{flex:0 0 auto;padding:0 16px}}
.tab.set{color:var(--accent-strong);border-color:var(--accent)}
.tab.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-strong)}


.pair{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:end}
.pair .fields{display:grid;gap:12px}
.swap-col{padding-bottom:4px}
.swap-inline{display:none !important}
@media (min-width:760px){
  .pair{grid-template-columns:1fr}
  .pair .fields{grid-template-columns:1fr auto 1fr;align-items:end}
  .swap-col{display:none}
  .swap-inline{display:inline-grid !important;margin-bottom:4px}
}

.field{position:relative}
.field label{display:block;font-size:14px;color:var(--text-2);margin-bottom:4px}
.input{
  width:100%;font-size:17px;padding:11px 14px;min-height:48px;
  border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--text);
  -webkit-appearance:none;appearance:none;
}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,144,226,.18)}
select.input{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.field.is-selected .input{border-color:var(--accent);padding-right:40px}
.field .check{position:absolute;right:12px;bottom:13px;width:22px;height:22px;color:var(--accent);display:none}
.field.is-selected .check{display:block}
.ac-list{
  position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;
  background:#fff;border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;z-index:40;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}
.ac-list li{padding:9px 14px;cursor:pointer;line-height:1.4}
.ac-list li[aria-selected="true"],.ac-list li:hover{background:var(--accent-weak)}
.ac-name{font-weight:600}
.ac-sub{font-size:13px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.ac-msg{padding:10px 14px;font-size:14px;color:var(--text-2);cursor:default}
.ac-msg.error{color:var(--danger)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--text-2);line-height:1.6}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row .grow{flex:1 1 220px}
.btn{
  font-size:16px;font-weight:600;border-radius:10px;padding:11px 18px;min-height:48px;
  border:1px solid var(--line);background:#fff;color:var(--text);
}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn-primary:hover{background:#2A64A6}
.btn-primary:disabled{background:#C7D5E6;border-color:#C7D5E6;color:#fff;cursor:not-allowed}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent-strong);padding-left:8px;padding-right:8px}
.btn-danger{color:var(--danger)}
.msg{font-size:14px;color:var(--text-2);min-height:1.4em;margin-top:8px}
.msg.error{color:var(--danger)}
.hint{font-size:13px;color:var(--text-3);margin-top:10px}

.favs{list-style:none;margin:0;padding:0}
.fav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line-2)}
.fav > div:first-child, .fav > .fav-pick{flex:1 1 200px;min-width:0}
.fav-actions{margin-left:auto}
.fav:first-child{border-top:0}
.fav-name{font-weight:600;overflow-wrap:anywhere}
.fav-sub{font-size:13px;color:var(--text-3)}
.fav-actions{display:flex;gap:6px;flex-shrink:0}
.fav-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
/* お気に入りの色分け（なし・行き・帰り） */
.kind-seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:3px;gap:2px}
.kind-seg-btn{border:0;background:transparent;border-radius:999px;min-height:36px;min-width:52px;padding:0 12px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer}
.kind-seg-btn[aria-checked=true]{background:#F1F3F5;color:var(--text)}
.kind-seg-btn.go[aria-checked=true]{background:var(--go-bg);color:var(--go);box-shadow:inset 0 0 0 1px var(--go)}
.kind-seg-btn.back[aria-checked=true]{background:var(--back-bg);color:var(--back);box-shadow:inset 0 0 0 1px var(--back)}
.empty-note{color:var(--text-3);font-size:15px;padding:4px 0}

/* ---------- メイン：区間カード ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.board-empty{
  grid-column:1/-1;background:#fff;border:1px dashed var(--field);border-radius:var(--radius);
  padding:28px 20px;text-align:center;color:var(--text-2);
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-head{padding:14px 16px 10px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card-label{font-size:13px;color:var(--text-3);margin-bottom:1px}
.route-title{font-size:19px;font-weight:700;line-height:1.35;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;overflow-wrap:anywhere}
.route-title .arrow{color:var(--accent);font-weight:600}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--text-3);margin-top:4px}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;color:var(--text-2);line-height:1.6}
.stale{font-size:13px;color:var(--danger);padding:8px 16px 0}

.trips{list-style:none;margin:0;padding:0}
.trip{padding:12px 16px 10px;border-top:1px solid var(--line-2)}
.trip:first-child{border-top:0}
.trip.first{box-shadow:inset 3px 0 0 var(--accent)}
.trip-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dep-wrap{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.day{font-size:13px;color:var(--text-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;align-self:center}
.dep-time{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.arr-time{font-size:15px;color:var(--text-2);font-variant-numeric:tabular-nums}
.until{font-size:15px;font-weight:600;color:var(--accent-strong);white-space:nowrap}
.until.soon{color:var(--danger)}
.trip-sub{font-size:14px;color:var(--text-2);margin-top:2px}
.trip-sub .sep{color:#B6BBC1;margin:0 6px}
.trip-lines{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.trip-lines .to-mark{color:var(--text-3);margin:0 4px}
.trip-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.flag{font-size:12px;border-radius:6px;padding:0 6px;line-height:1.7;border:1px solid var(--line);color:var(--text-2)}
.flag.warn{border-color:#F0C9C6;color:var(--danger)}

details.trip-detail{margin-top:4px}
details.trip-detail > summary{list-style:none;display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--accent-strong);cursor:pointer;padding:6px 0;min-height:36px}
details.trip-detail > summary::-webkit-details-marker{display:none}
details.trip-detail > summary .chev{width:14px;height:14px;color:var(--accent-strong)}
details.trip-detail[open] > summary .chev{transform:rotate(180deg)}
.legs{list-style:none;margin:4px 0 6px;padding:0}
.leg{margin-left:5px;padding:6px 0 8px 14px;border-left:3px solid #CED3D9}
.leg + .leg{margin-top:2px}
.leg-head{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.leg-head .mode{font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;color:var(--text-2);vertical-align:2px}
.leg-namesub{font-size:13px;color:var(--text-3);font-weight:400}
.leg-hs{font-size:14px;color:var(--text-2);margin-top:1px}
.leg-stop{display:flex;align-items:baseline;gap:10px;font-size:15px;margin-top:4px;flex-wrap:wrap}
.leg-stop .lt{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.1em}
.leg-stop .st{overflow-wrap:anywhere}
.track{font-size:12.5px;color:var(--text-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.7}
.delay{font-size:13px;color:var(--danger)}
.leg-walk{margin-left:5px;padding:4px 0 6px 14px;border-left:3px dotted #C3C8CE;color:var(--text-2);font-size:14px}
.leg-agency{font-size:13px;color:var(--text-3);margin-top:3px}

.state{padding:22px 16px;color:var(--text-2);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.state.error{color:var(--text)}
.state .state-text{flex:1}
.state .state-title{font-weight:600}
.state .btn{margin-top:10px;min-height:42px;padding:8px 14px;font-size:15px}
.ico-warn{width:20px;height:20px;color:var(--danger);flex-shrink:0;margin-top:2px}
.spinner{width:18px;height:18px;border:2px solid #DDE2E7;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;flex-shrink:0;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- いちばん上で引っぱって更新 ---------- */
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--text-3);font-size:13px;transition:height .22s ease}
.ptr.dragging{transition:none}
.ptr-inner{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.ptr svg{width:18px;height:18px;transition:transform .15s ease}
.ptr.armed{color:var(--accent-strong)}
.ptr.armed svg{transform:rotate(180deg)}
.ptr.loading svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.spinner,.icon-btn.is-busy svg{animation-duration:2.4s}}

/* ---------- 時刻の指定 ---------- */
.timebar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg-btn{border:0;background:transparent;border-radius:8px;min-height:42px;font-size:15px;font-weight:600;color:var(--text-2);padding:4px 6px;line-height:1.3}
.seg-btn[aria-pressed="true"]{background:#fff;color:var(--accent-strong);box-shadow:0 0 0 1px var(--line)}
.time-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.time-row .input{width:auto;flex:1 1 150px}
.time-quick{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.btn-small{min-height:38px;padding:6px 12px;font-size:14px;font-weight:500}
.day-type{font-size:14px;color:var(--text-2);flex-basis:100%}
.mode-note{font-size:13px;color:var(--text-2);padding:8px 16px 0}

/* ---------- 送る・開く ---------- */
.share-sec{padding:12px 0;border-top:1px solid var(--line-2)}
.share-sec:first-child{border-top:0}
.share-sec h3{font-size:16px;margin:0 0 4px}
.share-sec p{margin:4px 0 8px;font-size:14px;color:var(--text-2);line-height:1.6}
.share-actions{display:flex;flex-wrap:wrap;gap:8px}
.share-actions .btn{min-height:44px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.qr-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr-box .qr{width:168px;height:168px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
.qr-box .qr svg{width:100%;height:100%;display:block}
.url-text{font-size:13px;color:var(--text-2);word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px}
.check-row{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0 8px}
.check-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent-strong)}
.notice{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:8px}

.track.none{color:var(--text-3);border-style:dashed}
.track.usual{color:var(--text);border-style:solid}

/* ---------- 行き・帰りの色分け ---------- */
.card.kind-go{border-top:4px solid var(--go)}
.card.kind-back{border-top:4px solid var(--back)}
.kind-chip{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;line-height:1.8;margin-right:6px;vertical-align:1px}
.kind-chip.go{background:var(--go-bg);color:var(--go)}
.kind-chip.back{background:var(--back-bg);color:var(--back)}
.kind-chip.pick{background:var(--accent-weak);color:var(--accent-strong);font-weight:600}
.kind-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind-label{font-size:14px;color:var(--text-2);margin-right:2px;flex-basis:100%}
.kind-opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;font-size:15px;background:#fff}
.kind-opt input{accent-color:var(--accent-strong);width:16px;height:16px;margin:0}
.kind-opt:has(input:checked){border-color:var(--text-3);font-weight:600}
.kind-opt.go:has(input:checked){border-color:var(--go);background:var(--go-bg);color:var(--go)}
.kind-opt.back:has(input:checked){border-color:var(--back);background:var(--back-bg);color:var(--back)}
.fav.kind-go{box-shadow:inset 4px 0 0 var(--go);padding-left:12px}
.fav.kind-back{box-shadow:inset 4px 0 0 var(--back);padding-left:12px}
.fav-edit{display:grid;gap:10px;width:100%;padding:4px 0}
.memo{font-size:13px;color:var(--text-2);margin-top:3px}
.gmap-link{display:inline-block;font-size:13px;color:var(--accent-strong);margin-top:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.gmap-link:hover{background:var(--accent-weak)}

/* ---------- 出勤・帰宅の予想 ---------- */
.predict{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
.predict .p-title{font-weight:600;font-size:15px}
.predict .p-why{font-size:13px;color:var(--text-2);margin-top:1px}
.predict .seg{grid-template-columns:repeat(4,1fr);margin-top:8px}
.predict .seg-btn{font-size:14px;min-height:38px}
.predict .p-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.place-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line-2)}
.place-name{font-weight:600;overflow-wrap:anywhere}
.place-val{font-size:13px;color:var(--text-3)}
.place-search{flex-basis:100%}
.place-search .ac-list{position:static;box-shadow:none;max-height:none;margin-top:6px}
.place-search .ac-list li[role=option]{padding:11px 14px;border-top:1px solid var(--line-2)}
.place-search .ac-list li[role=option]:first-child{border-top:0}
.place-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.place-chips .chip-label{font-size:13px;color:var(--text-3);flex-basis:100%}
.place-chips button{font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:38px}
.fav-pick{all:unset;display:block;cursor:pointer;border-radius:8px;padding:2px 4px;margin:-2px -4px}
.fav-pick:focus-visible{outline:3px solid rgba(74,144,226,.45)}
.fav-pick:hover .fav-name{color:var(--accent-strong)}
.fav.is-pinned{background:var(--accent-weak);border-radius:10px;padding-left:10px;padding-right:6px}
.kind-chip.pin{background:#1A1A1A;color:#fff}
.unpin{all:unset;cursor:pointer;font-size:12px;color:var(--accent-strong);margin-right:8px;text-decoration:underline}
.card{scroll-margin-top:120px}
.dep-track{font-weight:600;color:var(--text)}
.dep-track.none{font-weight:400;color:var(--text-3)}
.dep-track.usual{font-weight:600;color:var(--text)}

/* ---------- フッター ---------- */
footer{max-width:1200px;margin:0 auto;padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);font-size:13px;color:var(--text-3);line-height:1.75}
footer p{margin:4px 0}
footer .disclaimer{color:var(--text-2)}

/* ---------- 設定ダイアログ ---------- */
dialog{
  border:none;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));
  max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);background:#fff;color:var(--text);
}
dialog::backdrop{background:rgba(26,26,26,.28)}
dialog.fallback-open{display:block;position:fixed;inset:16px;margin:auto;z-index:100;border:1px solid var(--line);overflow:auto}
.dlg-head{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-2);z-index:1}
.dlg-head h2{font-size:18px;margin:0}
.dlg-body{padding:6px 18px 8px;overflow:auto}
.dlg-foot{position:sticky;bottom:0;background:#fff;display:flex;justify-content:flex-end;gap:10px;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line-2)}
fieldset{border:0;margin:14px 0 0;padding:0}
legend,.set-label{font-size:15px;font-weight:600;margin-bottom:6px;padding:0;display:block}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent-strong);flex-shrink:0}
.opt-text{display:block;line-height:1.45}
.opt-title{font-weight:600;display:block}
.opt-desc{font-size:13.5px;color:var(--text-2);line-height:1.6;display:block;margin-top:2px}
.set-block{margin-top:16px}
.set-note{font-size:13px;color:var(--text-3);margin-top:6px;line-height:1.6}
.key-row{display:flex;gap:8px}
.key-row .input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger-zone{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-2)}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <div class="app-name">駅・バス時刻</div>
      <div class="clock" id="clock" aria-label="現在時刻">--:--<span class="sec">:--</span></div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="openShare" type="button" aria-label="スマホへ送る・ブラウザで開く" title="送る・開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
      <button class="icon-btn" id="refreshAll" type="button" aria-label="すべての区間を更新" title="すべて更新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" type="button" aria-label="設定" title="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="ptr" id="ptr" aria-hidden="true"><div class="ptr-inner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  <span id="ptrText">下に引いて更新</span>
</div></div>
<div class="sr-only" id="ptrLive" aria-live="polite"></div>
<main>
  <!-- 上のタブ：タップすると下に欄が開く（もう一度タップで閉じる） -->
  <nav class="tabs" id="tabs" aria-label="メニュー">
    <button type="button" class="tab" data-tab="addPanel" aria-controls="addPanel" aria-expanded="false">＋ 追加</button>
    <button type="button" class="tab" data-tab="favPanel" aria-controls="favPanel" aria-expanded="false">お気に入り</button>
    <button type="button" class="tab" data-tab="timebar" aria-controls="timebar" aria-expanded="false" id="timeTab">時刻指定</button>
    <button type="button" class="tab" data-tab="predictBar" aria-controls="predictBar" aria-expanded="false" id="orderTab" hidden>並び順</button>
  </nav>
  <div id="banners"></div>

  <!-- 区間追加エリア -->
  <section class="panel" id="addPanel" aria-label="区間を追加" hidden>
    <div class="panel-body">
      <div class="pair">
        <div class="fields">
          <div class="field" id="fromField">
            <label for="fromInput">出発（駅・バス停）</label>
            <input class="input" id="fromInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                   placeholder="例：金沢" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fromList">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <ul class="ac-list" id="fromList" role="listbox" hidden></ul>
          </div>
          <button class="icon-btn swap-inline" id="swapBtn2" type="button" aria-label="出発と到着を入れ替え" title="入れ替え">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
          </button>
          <div class="field" id="toField">
            <label for="toInput">到着（駅・バス停）</label>
            <input class="input" id="toInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                   placeholder="例：富山" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="toList">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <ul class="ac-list" id="toList" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="swap-col">
          <button class="icon-btn" id="swapBtn" type="button" aria-label="出発と到着を入れ替え" title="入れ替え">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 4v16l-3-3M16 20V4l3 3"/></svg>
          </button>
        </div>
      </div>
      <div class="row">
        <div class="field grow">
          <label for="labelInput">名前（任意）</label>
          <input class="input" id="labelInput" type="text" maxlength="30" autocomplete="off" placeholder="例：通勤（行き）">
        </div>
      </div>
      <div class="row">
        <div class="kind-pick" role="radiogroup" aria-label="区間の種類">
          <span class="kind-label">種類</span>
          <label class="kind-opt"><input type="radio" name="addKind" value="" checked><span>なし</span></label>
          <label class="kind-opt go"><input type="radio" name="addKind" value="go"><span>行き（出勤）</span></label>
          <label class="kind-opt back"><input type="radio" name="addKind" value="back"><span>帰り（帰宅）</span></label>
        </div>
      </div>
      <div class="row">
        <div class="field grow">
          <label for="memoInput">のりばメモ（任意）</label>
          <input class="input" id="memoInput" type="text" maxlength="40" autocomplete="off" placeholder="例：金沢駅 IRいしかわ鉄道 5番線">
        </div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="addBtn" type="button" disabled>お気に入りに登録</button>
      </div>
      <div class="msg" id="addMsg" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- お気に入り一覧 -->
  <section class="panel" id="favPanel" aria-label="お気に入り" hidden>
    <div class="panel-body">
      <ul class="favs" id="favList"></ul>
    </div>
  </section>

  <!-- 時刻の指定 -->
  <section class="timebar" id="timebar" aria-label="表示する時刻" hidden>
    <div class="seg" role="group" aria-label="時刻の指定">
      <button type="button" class="seg-btn" data-mode="now" aria-pressed="true">今すぐ</button>
      <button type="button" class="seg-btn" data-mode="dep" aria-pressed="false">出発時刻</button>
      <button type="button" class="seg-btn" data-mode="arr" aria-pressed="false">到着時刻</button>
    </div>
    <div class="time-row" id="timeRow" hidden>
      <label class="sr-only" for="dateInput">日付</label>
      <input class="input" type="date" id="dateInput">
      <label class="sr-only" for="timeInput">時刻</label>
      <input class="input" type="time" id="timeInput" step="60">
      <div class="time-quick">
        <button type="button" class="btn btn-small" data-shift="-60">−1時間</button>
        <button type="button" class="btn btn-small" data-shift="-10">−10分</button>
        <button type="button" class="btn btn-small" data-shift="10">＋10分</button>
        <button type="button" class="btn btn-small" data-shift="60">＋1時間</button>
      </div>
      <div class="day-type" id="dayTypeLabel" aria-live="polite"></div>
    </div>
  </section>

  <!-- 出勤・帰宅の予想 -->
  <section class="predict" id="predictBar" aria-live="polite" hidden></section>

  <!-- メイン表示エリア -->
  <section class="board" id="board" aria-label="登録した区間の時刻"></section>
</main>

<footer id="footer"></footer>

<!-- 設定 -->
<dialog id="settings" aria-labelledby="settingsTitle">
  <form id="settingsForm" method="dialog">
    <div class="dlg-head">
      <h2 id="settingsTitle">設定</h2>
      <button class="icon-btn small" type="button" id="closeSettings" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <fieldset>
        <legend>検索に使うデータ</legend>
        <label class="opt">
          <input type="radio" name="provider" value="transitous">
          <span class="opt-text"><span class="opt-title">Transitous</span></span>
        </label>
        <label class="opt">
          <input type="radio" name="provider" value="ekispert">
          <span class="opt-text"><span class="opt-title">駅すぱあと API</span></span>
        </label>
        <label class="opt">
          <input type="radio" name="provider" value="demo">
          <span class="opt-text"><span class="opt-title">デモ</span></span>
        </label>
      </fieldset>

      <div class="set-block">
        <label class="set-label" for="keyInput">駅すぱあと API アクセスキー</label>
        <div class="key-row">
          <input class="input" id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="未設定">
          <button class="btn" type="button" id="toggleKey">表示</button>
        </div>
      </div>

      <div class="set-block grid2">
        <div>
          <label class="set-label" for="countSel">各区間の表示件数</label>
          <select class="input" id="countSel">
            <option value="2">2件</option><option value="3">3件</option><option value="4">4件</option>
            <option value="5">5件</option><option value="6">6件</option><option value="8">8件</option>
          </select>
        </div>
        <div>
          <label class="set-label" for="xferSel">乗換回数の上限</label>
          <select class="input" id="xferSel">
            <option value="">指定なし</option><option value="0">乗換なしのみ</option>
            <option value="1">1回まで</option><option value="2">2回まで</option><option value="3">3回まで</option>
          </select>
        </div>
      </div>

      <div class="set-block">
        <label class="set-label" for="contactInput">連絡先（任意）</label>
        <input class="input" id="contactInput" type="text" autocomplete="off" placeholder="メールアドレスやWebサイトのURL">
      </div>

      <div class="set-block">
        <span class="set-label">自宅・職場</span>
        <label class="opt" style="margin-top:0">
          <input type="checkbox" id="useGps">
          <span class="opt-text"><span class="opt-title">現在地で出勤・帰宅を予想して並べる</span></span>
        </label>
        <div class="place-row">
          <div class="place-name">自宅（<span id="homeVal">未設定</span>）</div>
          <div class="share-actions"><button class="btn btn-small" type="button" id="setHome">今いる場所を自宅にする</button><button class="btn btn-small" type="button" id="clearHome">消す</button></div>
          <div class="field place-search" id="homeSearch" data-key="home">
            <label class="sr-only" for="homeInput">自宅を住所・駅名で探す</label>
            <input class="input" id="homeInput" type="text" autocomplete="off" enterkeyhint="search" placeholder="最寄駅名・住所（例：森本）" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="homeList">
            <ul class="ac-list" id="homeList" role="listbox" hidden></ul>
            <div class="place-chips" id="homeChips"></div>
          </div>
        </div>
        <div class="place-row">
          <div class="place-name">職場（<span id="workVal">未設定</span>）</div>
          <div class="share-actions"><button class="btn btn-small" type="button" id="setWork">今いる場所を職場にする</button><button class="btn btn-small" type="button" id="clearWork">消す</button></div>
          <div class="field place-search" id="workSearch" data-key="work">
            <label class="sr-only" for="workInput">職場を住所・駅名で探す</label>
            <input class="input" id="workInput" type="text" autocomplete="off" enterkeyhint="search" placeholder="最寄駅名・住所（例：森本）" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="workList">
            <ul class="ac-list" id="workList" role="listbox" hidden></ul>
            <div class="place-chips" id="workChips"></div>
          </div>
        </div>
        <label class="set-label" for="radiusSel" style="margin-top:10px">「近く」とみなす距離</label>
        <select class="input" id="radiusSel">
          <option value="300">300 m</option><option value="500">500 m</option><option value="1000">1 km</option><option value="2000">2 km</option><option value="5000">5 km</option>
        </select>
        <p class="set-note" id="placeMsg" role="status" aria-live="polite"></p>
      </div>

      <div class="danger-zone">
        <div id="wipeArea">
          <button class="btn btn-danger" type="button" id="wipeBtn">登録内容をすべて消去</button>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="cancelSettings">キャンセル</button>
      <button class="btn btn-primary" type="submit" id="saveSettings">保存</button>
    </div>
  </form>
</dialog>

<!-- スマホへ送る・ブラウザで開く -->
<dialog id="share" aria-labelledby="shareTitle">
  <div class="dlg-head">
    <h2 id="shareTitle">スマホへ送る・ブラウザで開く</h2>
    <button class="icon-btn small" type="button" id="closeShare" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="shareBody"></div>
  <div class="dlg-foot">
    <button class="btn" type="button" id="closeShare2">閉じる</button>
  </div>
</dialog>

  RAIL: '電車', REGIONAL_RAIL: '電車', REGIONAL_FAST_RAIL: '快速・特急', SUBURBAN: '電車',
  HIGHSPEED_RAIL: '新幹線', LONG_DISTANCE: '特急・長距離列車', NIGHT_RAIL: '夜行列車',
  FERRY: '船', AIRPLANE: '飛行機', FUNICULAR: 'ケーブルカー',
  AERIAL_LIFT: 'ロープウェイ', AREAL_LIFT: 'ロープウェイ', CABLE_CAR: 'ロープウェイ',
  ODM: 'デマンド交通', FLEX: 'デマンド交通', RIDE_SHARING: '相乗り', OTHER: '交通機関', TRANSIT: '交通機関'

  hs = String(hs || '').trim();
  if (!hs) return '';

const Transitous = {

  async searchStops(text, { signal, near } = {}) {

    if (near && isFinite(near.lat) && isFinite(near.lon)) p.set('place', `${near.lat},${near.lon}`);
    let data;
    try { data = await getJSON(`${this.base}/api/v1/geocode?${p}`, { signal }); }
    catch (e) { throw this.wrap(e); }
    if (!Array.isArray(data)) throw new AppError('format', '検索結果の形式が想定と異なります。');

      id: String(m.id), name: String(m.name), lat: m.lat, lon: m.lon,
      sub: areaText(m.areas), kinds: modeKinds(m.modes)

  async plan(route, { at, arriveBy, count, signal }) {
    const p = new URLSearchParams({

      detailedLegs: 'false', detailedTransfers: 'false', language: 'ja'

    let trips = this.parse(data);
    const cur = arriveBy ? 'previousPageCursor' : 'nextPageCursor';
    const enough = list => pickTrips(dedupeTrips(list), at, arriveBy, count).length >= count;

      const p2 = new URLSearchParams(p); p2.set('pageCursor', data[cur]);
      data = await this.call(p2, signal);

  async call(p, signal) {
    try { return await getJSON(`${this.base}/api/v6/plan?${p}`, { signal }); }

/* 15秒ごと：残り時間の更新・出発済みの便を消す・必要なら再取得 */
function tick() {
  const now = new Date();
  for (const r of state.routes) {
    const card = document.getElementById('card-' + r.id);
    if (!card) continue;
    const res = getRes(r.id);
    const busy = !!res.ctrl || !!res.queued;
    const sig = cardSig(res, now, busy);
    if (sig !== card.dataset.sig) { renderCard(r.id); continue; }
    card.querySelectorAll('.until[data-dep]').forEach(el => {
      const dep = new Date(+el.dataset.dep);
      el.textContent = untilText(dep, now);
      el.classList.toggle('soon', (dep - now) < 3 * 60000);
    });
  }
  refreshDue(false);
  applyOrder(false); // 時刻での予想は時間がたつと変わる
}

   画面：区間追加（検索候補つき入力）
   ===================================================================== */
function makeStopInput(fieldEl, { role, getOther, onChange }) {
  const input = $('input', fieldEl), list = $('ul', fieldEl);
  let selected = null, items = [], activeIdx = -1, timer = null, ctrl = null, seq = 0;
  const listId = list.id;

  function setSelected(v) {
    selected = v;
    fieldEl.classList.toggle('is-selected', !!v);
    onChange();
  }
  function close() {
    list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); activeIdx = -1;
  }
  function openWith(nodes) {
    list.replaceChildren(...nodes); list.hidden = false; input.setAttribute('aria-expanded', 'true');
  }
  function showMsg(text, isErr) { openWith([h('li', { class: 'ac-msg' + (isErr ? ' error' : ''), role: 'presentation', text })]); }
  function renderItems(extra) {
    if (!items.length) { showMsg('候補が見つかりませんでした。別の書き方（例：「駅」を付けない）でお試しください。'); return; }
    const mixed = new Set(items.map(it => it.provider)).size > 1;
    const nodes = items.map((it, i) => h('li', {
      id: `${listId}-o${i}`, role: 'option', 'aria-selected': i === activeIdx ? 'true' : 'false',
      onpointerdown: e => e.preventDefault(),
      onclick: () => choose(i)
    },
      h('div', { class: 'ac-name', text: it.name }),
      (it.sub || (it.kinds && it.kinds.length)) ? h('div', { class: 'ac-sub' },
        it.sub ? h('span', { text: it.sub }) : null,
        (it.kinds || []).map(k => h('span', { class: 'chip', text: k })),
        mixed && it.provider !== 'hokutetsu' ? h('span', { class: 'chip', text: providerOf(it.provider).label }) : null) : null));
    if (extra) nodes.push(h('li', { class: 'ac-msg error', role: 'presentation', text: extra }));
    openWith(nodes);
  }
  function highlight(i) {
    activeIdx = i;
    [...list.querySelectorAll('[role=option]')].forEach((li, k) => li.setAttribute('aria-selected', k === i ? 'true' : 'false'));
    const el = document.getElementById(`${listId}-o${i}`);
    if (el) { input.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block: 'nearest' }); }
  }
  function choose(i) {
    const it = items[i];
    if (!it) return;
    input.value = it.name;
    setSelected({ ...it, provider: it.provider || state.settings.provider });
    close();
  }
  async function run() {
    const q = input.value.trim();
    if (!q) { close(); return; }
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    const my = ++seq;
    const other = getOther();
    // もう一方で北鉄バスを選んでいれば北鉄バスだけ、ほかのデータを選んでいればそのデータだけを探す
    const local = (!other || other.provider === 'hokutetsu') ? Hokutetsu.searchLocal(q, { other, role }) : [];
    const apiId = other ? (other.provider === 'hokutetsu' ? null : other.provider) : state.settings.provider;
    if (local.length) { items = local; activeIdx = -1; renderItems(apiId ? '' : ''); if (apiId) list.append(h('li', { class: 'ac-msg', role: 'presentation', text: 'ほかの候補を検索中…' })); }
    else showMsg('検索中…');
    try {
      let remote = [], remoteErr = null;
      if (apiId) {
        try { remote = (await providerOf(apiId).searchStops(q, { signal: ctrl.signal, near: other })).map(x => ({ ...x, provider: apiId })); }
        catch (e) { if (e && e.name === 'AbortError') throw e; remoteErr = e; }
      }
      if (my !== seq) return;
      items = [...local, ...remote].slice(0, 12); activeIdx = -1;
      if (!items.length && remoteErr) throw remoteErr;
      if (document.activeElement === input) renderItems(remoteErr ? errText(remoteErr) : '');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (my !== seq) return;
      items = [];
      showMsg(errText(e), true);
    }
  }
  input.addEventListener('input', () => {
    if (selected) setSelected(null);
    clearTimeout(timer);
    timer = setTimeout(run, 300);
  });
  input.addEventListener('focus', () => { if (!selected && input.value.trim()) { clearTimeout(timer); timer = setTimeout(run, 50); } });
  input.addEventListener('blur', () => setTimeout(close, 180));
  input.addEventListener('keydown', e => {
    const n = items.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); if (list.hidden) renderItems(); highlight((activeIdx + 1) % n); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); highlight((activeIdx - 1 + n) % n); }
    else if (e.key === 'Enter') {
      if (!list.hidden && n) { e.preventDefault(); choose(activeIdx >= 0 ? activeIdx : 0); }
      else if (!selected) { e.preventDefault(); clearTimeout(timer); run(); }
    }
    else if (e.key === 'Escape') { close(); }
  });
  return {
    get value() { return selected; },
    set(v) { input.value = v ? v.name : ''; items = []; close(); setSelected(v || null); },
    clear() { this.set(null); },
    input
  };
}

    if (dh <= r) return { mode: 'go', why: `自宅の近く（約${fmtDist(dh)}）`, gps: true };
    if (st.work) {
      const dw = distM(geo.pos, st.work);

    const q = input.value.trim();
    if (!q) { close(); return; }
    const m = zen2han(q).replace(/[，、]/g, ',').match(/^\s*(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)\s*$/);
    if (m) { items = [{ lat: +m[1], lon: +m[2], label: `緯度 ${(+m[1]).toFixed(5)}・経度 ${(+m[2]).toFixed(5)}`, sub: '貼り付けた座標' }]; render(); return; }
    // 登録済みの区間で座標がわかる駅・停留所も候補にする
    const local = [];
    const qq = normQ(q).replace(/駅$/, '');
    const nameHit = label => { const nn = normQ(label).replace(/駅$/, ''); return !!qq && !!nn && (nn.includes(qq) || qq.includes(nn)); };
    const builtin = Object.entries(HK_POS).map(([name, [lat, lon]]) => ({ lat, lon, label: name, sub: '北鉄バス停（おおよその位置）' }));
    for (const st of [...knownStops(), ...builtin]) {
      if (nameHit(st.label) && !local.some(x => x.label === st.label)) local.push(st);
    }
    const hitRank = label => { const nn = normQ(label).replace(/駅$/, ''); return nn === qq ? 0 : nn.startsWith(qq) ? 1 : 2; };
    local.sort((a, b) => hitRank(a.label) - hitRank(b.label));
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    const my = ++seq;
    if (local.length) { items = local; render(); } else msg('検索中…');
    try {
      const bias = stopsCenter(); // 今いる場所は送らない
      const ask = extra => {
        const p = new URLSearchParams({ text: q.replace(/駅$/, '') || q, language: 'ja', numResults: '8', ...extra });
        if (bias) { p.set('place', `${bias.lat},${bias.lon}`); p.set('placeBias', '5'); }
        return getJSON(`${Transitous.base}/api/v1/geocode?${p}`, { signal: ctrl.signal });
      };
      const [stopsRes, allRes] = await Promise.allSettled([ask({ type: 'STOP' }), ask({})]);
      if (my !== seq) return;
      if (stopsRes.status === 'rejected' && allRes.status === 'rejected') throw allRes.reason;
      const conv = x => {
        const modes = Array.isArray(x.modes) ? x.modes.join(' ') : '';
        const rail = x.type === 'STOP' && /RAIL|SUBWAY|METRO|TRAM|MONORAIL|FUNICULAR/.test(modes);
        const bus = x.type === 'STOP' && !rail && /BUS|COACH/.test(modes);
        let label = [x.name, x.houseNumber].filter(Boolean).join(' ');
        if (rail && !/駅$/.test(label)) label += '駅'; // 鉄道の駅は「森本駅」のように
        return { lat: x.lat, lon: x.lon, label,
          sub: [areaText(x.areas), rail ? '駅' : bus ? 'バス停' : x.type === 'STOP' ? '駅・停留所' : x.type === 'ADDRESS' ? '住所' : '場所'].filter(Boolean).join('・') };
      };
      const ok = v => v.status === 'fulfilled' && Array.isArray(v.value) ? v.value.filter(x => x && isFinite(x.lat) && isFinite(x.lon) && x.name) : [];
      let remote = [];
      for (const x of [...ok(stopsRes), ...ok(allRes)].map(conv)) {
        if (local.some(y => y.label.replace(/駅$/, '') === x.label.replace(/駅$/, '') && distM(x, y) < 800)) continue;
        if (!remote.some(y => y.label === x.label && distM(x, y) < 300)) remote.push(x);
      }
      if (bias) {
        // 近くて名前が合うもの → 近いもの → 遠いが名前が合うもの。遠くて名前も違うもの（似た字の別の場所）は出さない
        const near = x => distM(bias, x) <= 60000;
        const g = x => near(x) ? (nameHit(x.label) ? 0 : 1) : (nameHit(x.label) ? 2 : 9);
        remote = remote.map((x, i) => ({ x, i, g: g(x) })).filter(o => o.g < 9).sort((a, b) => a.g - b.g || a.i - b.i).map(o => o.x);
      } else if (remote.some(x => nameHit(x.label))) {
        remote = remote.filter(x => nameHit(x.label)); // 基準の場所がないときは、名前が合うものだけ
      }
      items = [...local, ...remote].slice(0, 10);
      if (items.length) render(); else msg('見つかりませんでした。駅名を短くする（例：「森本駅」→「森本」）か、住所で探してください。地図アプリで調べた「緯度,経度」を貼り付けても設定できます。');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (my !== seq) return;
      if (local.length) return;
      items = []; msg('検索できませんでした（' + errText(e) + '）。地図アプリで調べた「緯度,経度」を貼り付けても設定できます。', true);
    }
  }
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 350); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); if (!list.hidden && items.length === 1) choose(items[0]); else run(); } else if (e.key === 'Escape') close(); });
  input.addEventListener('input', () => { if (!input.value.trim()) close(); });
}
/* 登録した区間の駅・停留所（座標がわかるもの） */
function knownStops() {
  const out = [];
  for (const r of state.routes) for (const st of [r.from, r.to]) {
    if (!st || out.some(x => x.label === st.name)) continue;
    const hk = HK_POS[st.name];
    if (st.lat != null && st.lon != null && isFinite(st.lat) && isFinite(st.lon)) out.push({ lat: +st.lat, lon: +st.lon, label: st.name, sub: '登録した区間の駅・停留所' });
    else if (hk && (st.provider === 'hokutetsu' || r.provider === 'hokutetsu')) out.push({ lat: hk[0], lon: hk[1], label: st.name, sub: '登録した区間の停留所（おおよその位置）' });
  }
  return out;
}
function stopsCenter() {
  const k = knownStops();
  if (k.length) return { lat: k.reduce((a, b) => a + b.lat, 0) / k.length, lon: k.reduce((a, b) => a + b.lon, 0) / k.length };
  if (state.routes.some(r => r.provider === 'hokutetsu')) return { lat: 36.5613, lon: 136.6562 }; // 金沢市の中心あたり（検索の優先にだけ使う）
  return null;
}
function renderPlaceChips() {
  const k = knownStops();
  for (const key of ['home', 'work']) {
    const box = document.getElementById(key + 'Chips');
    if (!box) continue;
    box.replaceChildren(...(k.length ? [h('span', { class: 'chip-label', text: '登録した駅：' }),
      ...k.map(st => h('button', { type: 'button', onclick: () => savePlace(key, st, `「${st.label}」`), text: st.label }))] : []));
  }
}
makePlaceSearch('home');
makePlaceSearch('work');
function syncPlaceUI() {
  $('#homeVal').textContent = placeText(state.settings.home);
  $('#workVal').textContent = placeText(state.settings.work);
  renderPlaceChips();
}
async function setPlace(key) {
  const msg = $('#placeMsg');
  msg.textContent = '現在地を取得しています…';
  try {
    const pos = await getPos(true);
    geo.pos = pos; geo.at = Date.now(); geo.err = '';
    savePlace(key, { lat: pos.lat, lon: pos.lon, label: '今いる場所' }, '今いる場所');
    msg.textContent += `（誤差 約${fmtDist(pos.acc || 0)}）`;
  } catch (e) { msg.textContent = e.message; }
}
$('#setHome').addEventListener('click', () => setPlace('home'));
$('#setWork').addEventListener('click', () => setPlace('work'));
$('#clearHome').addEventListener('click', () => { state.settings.home = null; saveState(); syncPlaceUI(); applyOrder(false); });
$('#clearWork').addEventListener('click', () => { state.settings.work = null; saveState(); syncPlaceUI(); applyOrder(false); });

/* =====================================================================
   スマホへ送る・ブラウザで開く
   ===================================================================== */
const shareDlg = $('#share');
const UA = navigator.userAgent || '';
const isLineApp = /\bLine\//i.test(UA);
const isInApp = isLineApp || /FBAN|FBAV|Instagram|MicroMessenger/i.test(UA);
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const isWebUrl = () => /^https?:$/.test(location.protocol) && !/^(localhost|127\.|\[::1\]|0\.0\.0\.0)/.test(location.hostname);
const pageUrl = () => location.href.split('#')[0].replace(/([?&])openExternalBrowser=1&?/, '$1').replace(/[?&]$/, '');
const SHARE_NAME = '駅バス時刻.html';
function openDialog(d) { if (typeof d.showModal === 'function') d.showModal(); else { d.setAttribute('open', ''); d.classList.add('fallback-open'); } }
function closeDialog(d) { if (typeof d.close === 'function' && d.open) d.close(); d.removeAttribute('open'); d.classList.remove('fallback-open'); }

/* 送るファイル：このアプリそのもの（必要なら登録した区間を入れる。キーは入れない） */
function buildShareHtml(withRoutes) {
  const seed = withRoutes && state.routes.length ? {
    v: 1, routes: state.routes.map(r => ({ ...r })),
    settings: { provider: state.settings.provider, perRoute: state.settings.perRoute, maxTransfers: state.settings.maxTransfers, campusBreak: state.settings.campusBreak }
  } : null;
  const json = seed ? JSON.stringify(seed).replace(/</g, '\\u003c') : '';
  return SELF_HTML.replace(/<script id="seedData" type="application\/json">[\s\S]*?<\/script>/, () => `<script id="seedData" type="application/json">${json}<\/script>`);
}
function downloadFile(html, statusEl) {
  try {
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = h('a', { href: url, download: SHARE_NAME });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    statusEl.textContent = `「${SHARE_NAME}」を保存しました。LINE などでファイルとして送れます。`;
  } catch { statusEl.textContent = 'この環境ではファイルを保存できませんでした。'; }
}
async function shareFile(withRoutes, statusEl) {
  const html = buildShareHtml(withRoutes);
  let file = null;
  try { file = new File([html], SHARE_NAME, { type: 'text/html' }); } catch { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '駅・バス時刻' }); statusEl.textContent = '送り先のアプリを開きました。'; return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  downloadFile(html, statusEl); // ファイルを直接送れないときは保存する
}
async function copyText(text, statusEl) {
  try { await navigator.clipboard.writeText(text); statusEl.textContent = 'URLをコピーしました。LINE などに貼り付けて送れます。'; }
  catch { statusEl.textContent = 'コピーできませんでした。上のURLを長押ししてコピーしてください。'; }
}
async function shareUrl(statusEl) {
  const url = pageUrl();
  if (navigator.share) {
    try { await navigator.share({ title: '駅・バス時刻', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyText(url, statusEl);
}
function externalUrl() {
  const u = pageUrl();
  if (isLineApp) return u + (u.includes('?') ? '&' : '?') + 'openExternalBrowser=1'; // LINE の中のブラウザから外へ
  if (isAndroid) { const x = new URL(u); return `intent://${x.host}${x.pathname}${x.search}#Intent;scheme=${x.protocol.replace(':', '')};end`; }
  return u;
}
function renderShare() {
  const body = $('#shareBody');
  body.textContent = '';
  const status = h('p', { class: 'msg', role: 'status', 'aria-live': 'polite' });
  const web = isWebUrl();

  if (isInApp && web) {
    body.append(h('section', { class: 'share-sec' },
      h('h3', { text: 'ブラウザで開き直す' }),
      h('div', { class: 'notice', text: 'アプリの中で開いています。Safari や Chrome で開いてください。' }),
      h('div', { class: 'share-actions' }, h('a', { class: 'btn btn-primary', href: externalUrl(), rel: 'noopener', text: isIOS ? 'Safari で開く' : 'ブラウザで開く' })),
      null));
  }

  if (web) {
    const url = pageUrl();
    const qr = h('div', { class: 'qr', role: 'img', 'aria-label': 'このページのURLのQRコード' });
    try {
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch { qr.textContent = 'QRコードを作れませんでした'; }
    const lineShare = 'https://line.me/R/share?text=' + encodeURIComponent('駅・バス時刻\n' + url);
    body.append(h('section', { class: 'share-sec' },
      h('h3', { text: 'スマホですぐブラウザで開く' }),
      h('div', { class: 'qr-box' }, qr),
      h('div', { class: 'url-text', text: url }),
      h('div', { class: 'share-actions', style: 'margin-top:10px' },
        h('a', { class: 'btn btn-primary', href: lineShare, target: '_blank', rel: 'noopener noreferrer', text: 'LINEでURLを送る' }),
        h('button', { class: 'btn', type: 'button', onclick: () => shareUrl(status), text: 'ほかのアプリで送る' }),
        h('button', { class: 'btn', type: 'button', onclick: () => copyText(url, status), text: 'URLをコピー' }))));
  } else {
    body.append(h('section', { class: 'share-sec' },
      h('h3', { text: 'スマホですぐブラウザで開く' }),
      h('div', { class: 'notice', text: 'ファイルとして開いているため、URL・QRコードでは渡せません。' })));
  }

  const chk = h('input', { type: 'checkbox', id: 'shareWithRoutes', checked: state.routes.length ? true : null, disabled: state.routes.length ? null : true });
  body.append(h('section', { class: 'share-sec' },
    h('h3', { text: 'HTMLファイルで送る・保存する' }),
    h('label', { class: 'check-row', for: 'shareWithRoutes' }, chk,
      h('span', { text: `登録した区間（${state.routes.length}件）も入れる` })),
    h('div', { class: 'share-actions' },
      h('button', { class: 'btn btn-primary', type: 'button', onclick: () => shareFile(chk.checked, status), text: 'ファイルを送る（LINEなど）' }),
      h('button', { class: 'btn', type: 'button', onclick: () => downloadFile(buildShareHtml(chk.checked), status), text: '端末に保存' }))));
  body.append(status);
}
$('#openShare').addEventListener('click', () => { renderShare(); openDialog(shareDlg); });
$('#closeShare').addEventListener('click', () => closeDialog(shareDlg));
$('#closeShare2').addEventListener('click', () => closeDialog(shareDlg));
shareDlg.addEventListener('click', e => { if (e.target === shareDlg) closeDialog(shareDlg); });

/* ---------- 送られてきたファイルの区間を取り込む ---------- */
let seedNotice = '', seedOffer = null;
function importSeed() {
  let seed = null;
  try { const t = ($('#seedData').textContent || '').trim(); if (t) seed = JSON.parse(t); } catch { seed = null; }
  if (!seed || !Array.isArray(seed.routes) || !seed.routes.length) return;
  const sig = String(hash(JSON.stringify(seed.routes)));
  let done = null;
  try { done = localStorage.getItem('ekibus.seed'); } catch { done = null; }
  if (done === sig) return;
  const mark = () => { try { localStorage.setItem('ekibus.seed', sig); } catch { } };
  const valid = seed.routes.filter(r => r && r.from && r.to && r.from.id && r.to.id && PROVIDERS[r.provider]);
  const fresh = valid.filter(r => !state.routes.some(x => x.provider === r.provider && x.from.id === r.from.id && x.to.id === r.to.id));
  if (!fresh.length) { mark(); return; }
  if (!state.routes.length) {
    state.routes = fresh.map(r => ({ ...r, id: uid() }));
    if (seed.settings) for (const k of ['provider', 'perRoute', 'maxTransfers', 'campusBreak']) if (k in seed.settings) state.settings[k] = seed.settings[k];
    saveState(); mark();
    seedNotice = `送られてきた区間（${fresh.length}件）を登録しました。`;
  } else {
    seedOffer = { routes: fresh, mark };
  }
}

/* ---------- ホーム画面に追加（PWA の簡易対応） ---------- */
(function addManifest() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const icon = document.querySelector('link[rel="apple-touch-icon"]').href;
    const start = location.href.split('#')[0];
    const m = { name: '駅・バス時刻', short_name: '時刻', start_url: start, scope: start.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#FFFFFF', theme_color: '#FFFFFF', lang: 'ja', icons: [{ src: icon, sizes: '180x180', type: 'image/png' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
    document.head.appendChild(l);
  } catch { /* 対応していなくても動作に影響なし */ }
})();

/* =====================================================================
   起動
   ===================================================================== */
$('#refreshAll').addEventListener('click', () => refreshDue(true));

/* 画面のいちばん上で下に引っぱると、すべての区間を更新（スマホのアプリと同じ操作） */
const PullRefresh = (() => {
  const el = $('#ptr'), txt = $('#ptrText'), live = $('#ptrLive');
  const TH = 64, MAX = 96;
  let y0 = null, x0 = 0, d = 0, active = false, loading = false;
  const set = (px, cls, t) => { el.style.height = px + 'px'; el.className = 'ptr' + (cls ? ' ' + cls : ''); if (t) txt.textContent = t; };
  const reset = () => { set(0, '', null); active = false; y0 = null; d = 0; };
  const blocked = () => loading || window.scrollY > 0 || !!document.querySelector('dialog[open], .fallback-open');
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || blocked()) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; active = false; d = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    if (e.touches.length !== 1) { reset(); return; }
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!active) {
      if (dy > 8 && dy > Math.abs(dx) * 1.5 && window.scrollY <= 0) active = true;
      else { if (dy < -4 || Math.abs(dx) > 12) y0 = null; return; }
    }
    if (e.cancelable) e.preventDefault(); // 引っぱっている間はページを動かさない
    d = Math.min(MAX, Math.max(0, (dy - 8) * 0.5));
    set(d, 'dragging' + (d >= TH ? ' armed' : ''), d >= TH ? '離すと更新' : '下に引いて更新');
  }, { passive: false });
  addEventListener('touchend', () => {
    if (y0 == null) return;
    const go = active && d >= TH;
    y0 = null;
    if (go) run(); else reset();
  }, { passive: true });
  addEventListener('touchcancel', () => { if (y0 != null) reset(); }, { passive: true });
  async function run() {
    if (loading) return;
    if (navigator.onLine === false) { set(44, '', 'オフラインのため更新できません'); live.textContent = txt.textContent; setTimeout(reset, 1600); return; }
    if (!state.routes.length) { reset(); return; }
    loading = true; set(44, 'loading', '更新中…'); live.textContent = '更新中';
    const t0 = Date.now();
    refreshDue(true);
    const busy = () => [...results.values()].some(r => r.ctrl);
    while (Date.now() - t0 < 20000 && (Date.now() - t0 < 500 || busy())) await new Promise(r => setTimeout(r, 150));
    loading = false;
    set(44, '', busy() ? '更新を続けています…' : '更新しました'); live.textContent = txt.textContent;
    setTimeout(() => { if (!loading && y0 == null) reset(); }, 800);
  }
  return { run };
})();
window.addEventListener('online', () => { renderBanners(); refreshDue(false); });
window.addEventListener('offline', renderBanners);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tickClock(); tick(); refreshPosition(false); } });
window.addEventListener('pageshow', e => { if (e.persisted) { tickClock(); tick(); } });

loadState();
importSeed();
loadCache();
tickClock();
syncTimeUI();
renderAll();
refreshDue(false);
refreshPosition(false);
setInterval(tickClock, 1000);
setInterval(tick, 15000);
